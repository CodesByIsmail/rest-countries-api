    <link rel="stylesheet" href="style.css" />

          <i class="uil uil-moon"></i>
          <p>Dark mode</p>
        </div>
      </div>
    </nav>

    <section class="home__view">
      <div class="navigator container">
        <div class="search__div">
          <i class="uil uil-search"></i>
          <input
            type="text"
            placeholder="Search for country..."
            class="search__input"
            id="search__input"
          />
        </div>

        <div class="filter__region">
          <h3>Filter By Region <i class="uil uil-angle-down"></i></h3>

          <ul class="filter__wrapper hidden">
            <li class="filter__list" data-value="Africa">Africa</li>
            <li class="filter__list" data-value="Americas">America</li>
            <li class="filter__list" data-value="Asia">Asia</li>
            <li class="filter__list" data-value="Europe">Europe</li>
            <li class="filter__list" data-value="Oceania">Oceania</li>
          </ul>
        </div>
      </div>

      <section class="countries container">
        <p class="error__text hidden">No Country found!</p>
